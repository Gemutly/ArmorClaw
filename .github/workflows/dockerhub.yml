# Build and Push Docker Image to Docker Hub
# Triggers on push to main branch and when tags are created

name: Docker Hub Build & Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [created]

env:
  DOCKER_IMAGE: mikegemut/armorclaw
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  precheck:
    name: Pre-check (vet + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'bridge/go.mod'
          cache-dependency-path: 'bridge/go.sum'

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev libsqlcipher-dev libolm-dev

      - name: Go vet RPC packages
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I/usr/include"
          CGO_LDFLAGS: "-L/usr/lib/x86_64-linux-gnu -lsqlcipher"
        run: cd bridge && go vet ./pkg/rpc/... ./internal/adapter/...

      - name: Compile bridge binary
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I/usr/include"
          CGO_LDFLAGS: "-L/usr/lib/x86_64-linux-gnu -lsqlcipher"
        run: cd bridge && go build -o /dev/null ./cmd/bridge

  rpc-unit-tests:
    name: RPC Unit Tests
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'bridge/go.mod'
          cache-dependency-path: 'bridge/go.sum'

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyara-dev libsqlcipher-dev libolm-dev

      - name: Run RPC unit tests
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I/usr/include"
          CGO_LDFLAGS: "-L/usr/lib/x86_64-linux-gnu -lsqlcipher"
        run: |
          cd bridge
          go test -v -race -coverprofile=coverage.out ./pkg/rpc/...
          go tool cover -func=coverage.out | grep total

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-coverage
          path: bridge/coverage.out

  rpc-integ-tests:
    name: RPC Integration Tests
    needs: rpc-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'bridge/go.mod'
          cache-dependency-path: 'bridge/go.sum'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat libsqlcipher-dev libyara-dev libolm-dev

      - name: Build bridge with SQLCipher
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: "-I/usr/include"
          CGO_LDFLAGS: "-L/usr/lib/x86_64-linux-gnu -lsqlcipher -lyara"
        run: |
          cd bridge
          go build -o build/armorclaw-bridge ./cmd/bridge

      - name: Run integration tests
        run: |
          chmod +x tests/test-rpc-methods.sh
          ./tests/test-rpc-methods.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rpc-integ-logs
          path: /tmp/bridge-test-*.log
          if-no-files-found: ignore

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rpc-unit-tests, rpc-integ-tests]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build multi-platform image for distribution
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.quickstart
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build single-platform image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.quickstart
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Runtime gate — verify shared libraries resolve (ldd)
        run: |
          IMAGE_TAG="${{ env.DOCKER_IMAGE }}:latest"
          echo "Checking shared library resolution for bridge binary..."
          # Run ldd on the bridge binary inside the container
          LDD_OUTPUT=$(docker run --rm --entrypoint "" "$IMAGE_TAG" \
            ldd /usr/local/bin/armorclaw-bridge 2>&1) || true
          echo "$LDD_OUTPUT"
          # Fail if any library is reported as "not found"
          if echo "$LDD_OUTPUT" | grep -q "not found"; then
            echo "::error::ldd reported missing shared libraries"
            echo "$LDD_OUTPUT" | grep "not found"
            exit 1
          fi
          echo "All shared libraries resolved successfully"

      - name: Runtime gate — verify bridge starts and health endpoint answers
        run: |
          IMAGE_TAG="${{ env.DOCKER_IMAGE }}:latest"
          echo "Starting container for runtime gate..."
          docker run -d --name smoke-test \
            -e ARMORCLAW_SKIP_DOCKER_CHECK=true \
            -e ARMORCLAW_SKIP_SYSTEMD=true \
            "$IMAGE_TAG"

          # Wait for bridge process to initialise
          echo "Waiting 10 seconds for bridge to start..."
          sleep 10

          # Check if container is still running (bridge process alive)
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
            echo "::error::Container failed to stay running for 10 seconds"
            docker logs smoke-test
            exit 1
          fi
          echo "Bridge process stayed running for 10 seconds"

          # Verify /health endpoint answers (HTTP on internal port)
          # The bridge exposes health on port 8443 inside the container
          HEALTH_STATUS=$(docker exec smoke-test \
            wget -qO- --timeout=5 http://127.0.0.1:8443/health 2>&1) || true
          if [ -z "$HEALTH_STATUS" ]; then
            # Fallback: try curl if wget not available
            HEALTH_STATUS=$(docker exec smoke-test \
              curl -sf --max-time 5 http://127.0.0.1:8443/health 2>&1) || true
          fi
          echo "Health endpoint response: $HEALTH_STATUS"
          # A non-empty response means the endpoint answered
          if [ -z "$HEALTH_STATUS" ]; then
            echo "::warning::Could not reach /health endpoint (may be expected in CI without full config)"
          fi

          docker logs smoke-test

      - name: Cleanup smoke test
        if: always()
        run: docker rm -f smoke-test || true

      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-scan'

      - name: Generate deployment summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Image:** ${{ env.DOCKER_IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Platforms:** ${{ env.PLATFORMS }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Output image details
        if: github.event_name != 'pull_request'
        run: |
          echo "Docker Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Platform: ${{ env.PLATFORMS }}"

  docker-push:
    name: Push to Docker Hub
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.quickstart
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: docker-push
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Pull and test image
        run: |
          # Pull the image
          docker pull ${{ env.DOCKER_IMAGE }}:latest

          # Test that the image runs (help flag should work without Docker socket)
          docker run --rm ${{ env.DOCKER_IMAGE }}:latest --help

          # Verify image exists (use env variable, not hardcoded name)
          docker images | grep -E "${{ env.DOCKER_IMAGE }}|armorclaw"
      
      - name: Image information
        run: |
          echo "## Image Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image pulled successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image runs without errors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Size" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker images ${{ env.DOCKER_IMAGE }}:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    if: failure()
    needs: docker-push
    
    steps:
      - name: Send notification
        run: |
          echo "::error::Docker Hub build/push failed"
          echo "Check the workflow logs for details"
