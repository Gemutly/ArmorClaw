# Docker Compose: ArmorClaw Python Office Sidecar
# MarkItDown polyglot sidecar for .xlsx, .pptx, .msg, .doc, .xls, .ppt
#
# Symmetrical containment with Rust sidecar:
#   - network_mode: none (zero network)
#   - UID 10001 (non-root, same as Rust)
#   - cap_drop: ALL
#   - read_only filesystem
#   - AppArmor profile
#   - tmpfs for large file spill
#
# Usage:
#   docker compose -f deploy/docker-compose.sidecar-py.yml up -d
#
# Socket: /run/armorclaw/sidecar-office/sidecar-office.sock (host)
# Container sees: /run/armorclaw/sidecar-office.sock

services:
  # One-shot init container: generates /run/armorclaw/secrets/office-hmac
  # before the sidecar starts. Runs as root to create dirs and chown.
  # The secret is a 64-char hex string (32 bytes of /dev/urandom).
  office-secret-init:
    image: busybox:latest
    user: "0:0"
    container_name: office-secret-init
    command: >
      sh -c '
        set -eu;
        mkdir -p /run/armorclaw/secrets;
        if [ ! -s /run/armorclaw/secrets/office-hmac ]; then
          head -c 32 /dev/urandom | xxd -p -c 64 > /run/armorclaw/secrets/office-hmac;
        fi;
        chown 10001:10001 /run/armorclaw/secrets/office-hmac;
        chmod 0440 /run/armorclaw/secrets/office-hmac;
      '
    volumes:
      - /run/armorclaw:/run/armorclaw
    restart: "no"

  sidecar-office:
    build:
      context: ../sidecar-python
      dockerfile: Dockerfile
    image: armorclaw/sidecar-office:latest
    container_name: armorclaw-sidecar-office
    user: "10001:10001"
    depends_on:
      office-secret-init:
        condition: service_completed_successfully
    restart: unless-stopped
    network_mode: none
    volumes:
      - /run/armorclaw/sidecar-office:/run/armorclaw
      - /run/armorclaw/secrets/office-hmac:/run/secrets/shared_secret:ro
    tmpfs:
      - /tmp/office_worker:size=512m,mode=0700
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=armorclaw-office-worker
    environment:
      - SIDECAR_SOCKET=/run/armorclaw/sidecar-office.sock
      - SIDECAR_SECRET_FILE=/run/secrets/shared_secret
      - SIDECAR_MAX_REQUESTS=50
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M
