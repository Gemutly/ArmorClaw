services:
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: armorclaw-mailpit
    restart: unless-stopped
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    tmpfs:
      - /tmp:size=32m,mode=0700
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
